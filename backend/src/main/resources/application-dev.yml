# Local development profile — zero-setup H2 database, file-based so data
# survives restarts. Switch to the "prod" profile (Postgres) for deployment.
spring:
  datasource:
    url: jdbc:h2:file:./data/infratech;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
