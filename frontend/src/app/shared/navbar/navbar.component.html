<header class="navbar" [class.scrolled]="scrolled || menuOpen">
  <div class="container navbar-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-mark">SQ</span>
      <span class="brand-text">
        <strong>Squarebuild</strong>
        <small>INFRATECH PVT. LTD.</small>
      </span>
    </a>

    <nav class="links" [class.open]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a routerLink="/properties" routerLinkActive="active" (click)="closeMenu()">Properties</a>
      <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact Us</a>
      <a routerLink="/contact" class="btn btn-gold cta-mobile" (click)="closeMenu()">Enquire Now</a>
    </nav>

    <a routerLink="/contact" class="btn btn-gold cta-desktop">Enquire Now</a>

    <button class="menu-toggle" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
